[graph]
# Check every platform the release workflow builds for, so a dependency that
# only appears on one of them cannot slip past.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
    "arm-unknown-linux-musleabi",
    "powerpc-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# RustSec advisories. Whatever matches fails the check. The way past one is an
# entry in `ignore` with a `reason`, and RELEASING.md says when that is right.
yanked = "deny"
ignore = []

[licenses]
# This is an LGPL-3.0-only program, so dependencies must be compatible
# with distributing it as a binary. Copyleft licences are deliberately absent:
# nothing in the tree needs one, and adding one should be a conscious decision.
allow = [
    # This program's own licence.
    "LGPL-3.0-only",
    # Dependencies.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate versions bloat a router binary. Warn rather than deny: a bump of a
# single dependency legitimately produces one until the rest catch up.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
# Everything must come from crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
