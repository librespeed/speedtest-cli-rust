[package]
name = "librespeed-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Unicode data for the sanitize target; already in the tree through url.
icu_properties = "2.2"
libfuzzer-sys = "0.4"
serde_json = "1"
url = "2"

[dependencies.librespeed-cli]
path = ".."

[[bin]]
name = "url_scheme"
path = "fuzz_targets/url_scheme.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_join"
path = "fuzz_targets/path_join.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize"
path = "fuzz_targets/sanitize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_list"
path = "fuzz_targets/server_list.rs"
test = false
doc = false
bench = false
