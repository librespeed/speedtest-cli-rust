name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything,
  # naming the commit it is about to release so the gate cannot pass on a
  # different one.
  workflow_call:
    inputs:
      ref:
        description: Commit to check; defaults to the calling commit
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --verbose
      - run: cargo test --verbose

  native-tls:
    name: Test with the OpenSSL backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --no-default-features --features native-tls --verbose

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Derived from rust-version in Cargo.toml, so the version checked here
      # cannot drift from the one declared to downstream packagers.
      - id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps |
            jq -er 'first(.packages[] |
              select(.name == "librespeed-cli") | .rust_version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets
      - run: cargo check --all-targets --no-default-features --features native-tls

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-fuzz --locked
      # Building only: a real campaign belongs in a scheduled run or OSS-Fuzz.
      # This keeps the targets compiling as the code they exercise changes.
      - run: cargo fuzz build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  parity:
    name: Differential test against the Go client
    runs-on: ubuntu-latest
    env:
      # The commit the expectations were recorded against. The test is given
      # it too and refuses to run against another one.
      LIBRESPEED_GO_COMMIT: b660d1e6c24f14fc93624538d9e73163e7784335
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: librespeed/speedtest-cli
          ref: ${{ env.LIBRESPEED_GO_COMMIT }}
          path: go-client
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-client/go.mod
          cache-dependency-path: go-client/go.sum
      - run: go build -o "$RUNNER_TEMP/librespeed-go" .
        working-directory: go-client
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --test parity
        env:
          LIBRESPEED_GO_BIN: ${{ runner.temp }}/librespeed-go
  package:
    name: Package the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What the release workflow does on a tag, minus the upload: builds
      # the crate as packaged, so an exclude that drops a file the build
      # needs fails here rather than half way through a release.
      - run: cargo package --locked

  cross:
    name: ${{ matrix.target }} (${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
        tls: [rustls-tls]
        include:
          # Proves the OpenSSL backend cross-builds, the configuration targets
          # without ring support (such as PowerPC) have to use. Vendored here
          # because the cross image has no OpenSSL for the target; OpenWrt
          # builds use plain `native-tls` against the SDK's libopenssl.
          - target: aarch64-unknown-linux-musl
            tls: vendored-openssl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cross@0.2.5 --locked
      - run: cross build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.tls }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librespeed-cli-${{ matrix.target }}-${{ matrix.tls }}
          path: target/${{ matrix.target }}/release/librespeed-cli
          if-no-files-found: error
