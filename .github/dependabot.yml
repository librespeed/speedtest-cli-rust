version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Keep the interlocking hyper/rustls stacks in one PR each: bumping them
      # piecemeal tends to produce PRs that cannot build on their own.
      hyper:
        patterns:
          - "hyper*"
          - "http*"
          - "tower*"
      tls:
        patterns:
          - "rustls*"
          - "native-tls"
          - "tokio-native-tls"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    ignore:
      # Its refs are Rust versions, not versions of the action, so a bump
      # here once offered a Rust that does not exist. Pinned by commit and
      # updated by hand; the compiler itself is named in `with:`.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns:
          - "*"
